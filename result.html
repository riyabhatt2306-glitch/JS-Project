<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Result</title>
    <link rel="stylesheet" href="navigation.css" type="text/css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body {
            background-color: #f7e1d7;
            font-family: Arial, sans-serif;
        }

       

        /* Main container */
        .main_div {
            background: linear-gradient(135deg, #9d8189, #836871);
            border-radius: 15px;
            width: 100%;
            height: 500px;
            max-width: 900px;
            margin: 60px auto;
            padding: 40px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            color: #fff;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .side-img {
            width: 250px;
            height: 250px;
            object-fit: contain;
        }

        .center-content {
            flex: 1;
            min-width: 250px;
            text-align: center;
        }

        .center-content h2 {
            margin: 15px 0;
            font-size: 2rem;
        }

        .center-content h3 {
            margin: 10px 0;
            font-size: 1.3rem;
            font-weight: normal;
            color: #f0e6e6;
        }

        .center-content p {
            font-weight: bold;
            margin: 5px 0;
        }

        /* Buttons */
        .btn-group {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .btn-primary,
        .btn-secondary {
            padding: 10px 25px;
            border: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn {
            background-color: #836871;
            color: #fff;
        }

        .btn:hover {
            background-color: #9d8189;
        }

        

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .main_div {
                flex-direction: column;
                text-align: center;
                padding: 30px 20px;
            }

            .side-img {
                width: 120px;
                height: 120px;
            }

            
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <div class="navbar">
        <div class="div_left brand">
            <a href="index.html">Quizzkaroo</a>
        </div>
        <div class="div_right">
            <a href="index.html">Home</a>
            <a href="quiz.html">Quiz</a>
            <a href="result.html">Result</a>
            <a href="login.html" class="btn" style="background-color: #9d8189;">Riya Bhatt ⮟</a>
        </div>
    </div>

    <!-- Result Card -->
    <div class="main_div">
        <img src="Images\boy_result.jpg" class="side-img" alt="Boy celebrating result">
        <div class="center-content">
            <h2>Congratulations!! 🎉</h2>
            <h3>Category: Web Designing</h3>
            <p>Your Answered</p>
            <h2>3 / 3</h2>
            <p>Questions Correct</p>

            <div class="btn-group">
                <a href="index.html" class="btn">Play Again</a>
                <a href="index.html" class="btn">Back to Home</a>
            </div>
        </div>
        <img src="Images\girl_result.webp" class="side-img" alt="Girl celebrating result">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
