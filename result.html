<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quiz Summary</title>

    <style>
        body {
            background-color: #f7e1d7;
            font-family: Arial, sans-serif;
        }

        .card {
            background: #9d8189;
            width: 600px;
            margin: 150px auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h2 {
            margin-bottom: 5px;
            color: #ffffff;
        }
        h3 {
            color: #ffffff;
        }

        .sub {
            color: #ffffff;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* progress bar */
        .progress {
            background: #e0e0e0;
            border-radius: 10px;
            height: 18px;
            margin: 10px 0 20px;
        }

        .progress-fill {
            background: #785e65;
            height: 100%;
            border-radius: 10px;
            width: 0%;
        }

        /* summary boxes */
        .summary {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .box {
            width: 48%;
            background: #e0e0e0;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-left: 10px;
            margin-right: 10px;
        }

        .box h3 {
            margin: 0;
            color: #785e65;
        }

        .time {
            margin-top: 20px;
            font-size: 14px;
            color: white;
        }

        .btn {
            margin-top: 25px;
            display: inline-block;
            padding: 10px 20px;
            background: #83676f;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>Quiz responses</h2>
    <div class="sub">Your response has been recorded</div>

    <h3 id="scoreText"></h3>

    <!-- Progress bar -->
    <div class="progress">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <!-- Summary -->
    <div class="summary">
        <div class="box">
            <p>Correct</p>
            <h3 id="correct"></h3>
        </div>
        <div class="box">
            <p>Incorrect</p>
            <h3 id="wrong"></h3>
        </div>
    </div>

    <div class="time" id="timeTaken"></div>

    <a href="selection.html" class="btn">Submit another response</a>
    <a href="index.html" class="btn" style="float:right">Back to home</a>

</div>

<script>
    let score = Number(localStorage.getItem("quizscore"));
    let total = Number(localStorage.getItem("totalquestions"));
    let startTime = localStorage.getItem("startTime");

    let percentage = Math.round((score / total) * 100);

    // score text
    document.getElementById("scoreText").innerText =
        "Score: " + score + " / " + total;

    // progress bar
    document.getElementById("progressFill").style.width = percentage + "%";

    // correct / wrong
    document.getElementById("correct").innerText = score;
    document.getElementById("wrong").innerText = total - score;

    // time taken
    let seconds = Math.floor((Date.now() - startTime) / 1000);
    document.getElementById("timeTaken").innerText =
        "Time taken: " + seconds + " seconds";

    // clear storage
    localStorage.clear();
</script>

</body>
</html>
