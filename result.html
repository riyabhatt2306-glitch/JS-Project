<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Quiz Summary</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            background-color: #f7e1d7;
            font-family: Arial, sans-serif;
        }

        .card {
            background: #9d8189;
            width: 600px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-bottom: 5px;
            color: #ffffff;
        }

        h3 {
            color: #ffffff;
        }

        .sub {
            color: #ffffff;
            font-size: 14px;
            margin-bottom: 25px;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .progress {
            background: #ddd;
            height: 12px;
            border-radius: 10px;
            margin: 15px 0;
        }

        .fill {
            background: #785e65;
            height: 100%;
            width: 0%;
            border-radius: 10px;
            transition: width 1s ease;
        }

        /* summary boxes */
        .summary {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .box {
            width: 48%;
            background: #e0e0e0;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-left: 10px;
            margin-right: 10px;
        }

        .box h3 {
            margin: 0;
            color: #785e65;
        }

        .time {
            margin-top: 20px;
            font-size: 14px;
            color: white;
        }

        .btn {
            margin-top: 25px;
            display: inline-block;
            padding: 10px 20px;
            background: #83676f;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .color_white {
            color: #ffffff;
        }

        .btn-row {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>Quiz responses</h2>
        <div class="sub">Your response has been recorded</div>

        <h3 id="scoreText"></h3>

        <div class="progress">
            <div class="fill" id="fill"></div>
        </div>



        <!-- Summary -->
        <div class="summary">
            <div class="box">
                <p>Correct</p>
                <h3 id="correct"></h3>
            </div>
            <div class="box">
                <p>Incorrect</p>
                <h3 id="wrong"></h3>
            </div>
        </div>



        <p id="attemptedText" class="color_white"></p>
        <p id="percentageText" class="color_white"></p>
        <p id="timeText" class="color_white"></p>

        <!-- Buttons Row -->
        <div class="btn-row">
            <a onclick="checkans()" class="btn">Answer Review</a>
            <a href="index.html" class="btn">Back to home</a>
            <a href="selection.html" class="btn">Submit another response</a>
        </div><br>
        <div id="review" class="color_white"></div>

    </div>
    <script>
        $(document).ready(function () {
            let score = Number(localStorage.getItem("quizscore"));
            let total = Number(localStorage.getItem("totalquestions"));
            let attempted = Number(localStorage.getItem("attempted"));
            let percentage = Number(localStorage.getItem("percentage"));

            //review button animation
            $(".card").hide().slideDown(800);

            document.getElementById("scoreText").innerText =
                "Score: " + score + " / " + total;

            document.getElementById("fill").style.width = percentage + "%";

            document.getElementById("correct").innerText = score;
            document.getElementById("wrong").innerText = total - score;

            document.getElementById("attemptedText").innerText =
                "Attempted: " + attempted;

            document.getElementById("percentageText").innerText =
                "Percentage: " + percentage + "%";

            document.getElementById("timeText").innerText = "Time Taken: 30 seconds";
            setTimeout(() => {
                document.getElementById("fill").style.width = percentage + "%";
            }, 300);
            $(".btn").hover(
                function () {
                    $(this).css("box-shadow", "0 0 10px #fff");
                },
                function () {
                    $(this).css("box-shadow", "none");
                }
            );

        });
        function checkans() {
            let total = Number(localStorage.getItem("totalquestions"));

            let reviewText = "";

            for (let i = 1; i <= total; i++) {

                let question = localStorage.getItem("question" + i);
                let userAns = localStorage.getItem("userAnswer" + i);
                let correctAns = localStorage.getItem("correctAnswer" + i);

                let op1 = localStorage.getItem("option1_" + i);
                let op2 = localStorage.getItem("option2_" + i);
                let op3 = localStorage.getItem("option3_" + i);
                let op4 = localStorage.getItem("option4_" + i);

                reviewText += "<br><b>Q" + i + ": " + question + "</b><br>";

                reviewText += "1) " + (op1 || "Not available") + "<br>";
                reviewText += "2) " + (op2 || "Not available") + "<br>";
                reviewText += "3) " + (op3 || "Not available") + "<br>";
                reviewText += "4) " + (op4 || "Not available") + "<br><br>";

                if (!userAns || userAns === "") {
                    reviewText += "Your Answer: Not Attempted<br>";
                } else {
                    reviewText += "Your Answer: Option " + userAns + "<br>";
                }

                reviewText += "Correct Answer: Option " + correctAns + "<br>";

                if (userAns == correctAns) {
                    reviewText += "<span style='color:lightgreen;'>✔ Correct</span><br>";
                } else {
                    reviewText += "<span style='color:red;'>✘ Wrong</span><br>";
                }

                reviewText += "<hr>";
            }

            $("#review").hide().html(reviewText).slideDown(500);
        }
    </script>

</body>

</html>
