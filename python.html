<!DOCTYPE html>
<html>

<head>
    <title>Simple MCQ Quiz</title>
    <style>
        /* ===== Preloader ===== */
        #preloader {
            position: fixed;
            width: 100%;
            height: 100%;
            background-color: #f7e1d7;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99;
        }

        .loader {
            border: 10px solid #ddd;
            border-top: 10px solid #755a60;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        body {
            background-color: #f7e1d7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial;
        }

        .box {
            background-color: #9d8189;
            padding: 30px;
            border-radius: 10px;
            width: 800px;
            color: white;
            height: 350px;
            padding-bottom: 45px;
        }

        .options {
            display: grid;
            gap: 15px;
            margin-top: 20px;
        }

        label {
            background: #7d6270;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        label:hover {
            background: #6b555d;
        }

        input {
            margin-right: 10px;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            background: #756068;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .h2 {
            text-align: center;
        }
    </style>
</head>

<body>
    <!-- Preloader -->
    <div id="preloader">
        <div class="loader"></div>
    </div>

    <div class="box">
        <h2 class="h2" id="progress_bar"></h2>
        <h3 id="question"></h3>

        <div class="options">
            <label>
                <input type="radio" name="option" value="1">
                <span
                    id="o1"></span><!--empty container,It holds only text,It is inline ,JavaScript can easily change it-->
            </label>

            <label>
                <input type="radio" name="option" value="2">
                <span id="o2"></span>
            </label>

            <label>
                <input type="radio" name="option" value="3">
                <span id="o3"></span>
            </label>

            <label>
                <input type="radio" name="option" value="4">
                <span id="o4"></span>
            </label>
        </div>

        <button id="prebutton" onclick="previousQuestion()">Previous</button>
        <button id="nextbutton" onclick="nextQuestion()">Next</button>
        <button id="submitbutton" onclick="submitbutton()" style="display:none;">Submit</button>

    </div>

    <script>
        let q = 1;
        let totalquestion = 3;
        let score = 0;
        let answers = {};//Object {} matches question numbers directly.

        loadQuestion();


        function loadQuestion() {

            document.getElementById("progress_bar").innerHTML = "Questions " + q + " of 3";


            if (q == 1) {
                question.innerText = "1. What is Python?";
                o1.innerText = "A programming language";
                o2.innerText = "A web browser";
                o3.innerText = "An operating system";
                o4.innerText = "A database";
            }

            else if (q == 2) {
                question.innerText = "2. Which symbol is used for comments in Python?";
                o1.innerText = "#";
                o2.innerText = "//";
                o3.innerText = "/* */";
                o4.innerText = "<!-- -->";
            }

            else if (q == 3) {
                question.innerText = "3. Which function is used to print output in Python?";
                o1.innerText = "print()";
                o2.innerText = "show()";
                o3.innerText = "display()";
                o4.innerText = "output()";
            }

            change_button();

            let options = document.getElementsByName("option");

            // clear all selections
            options.forEach(element => {
                element.checked = false;
            });

            // restore previous answer
            if (answers[q]) {
                options.forEach(element => {
                    if (element.value == answers[q]) {
                        element.checked = true;
                    }
                });
            }

        }

        function change_button() {
            document.getElementById("prebutton").disabled = (q === 1);

            if (q === totalquestion) {
                document.getElementById("nextbutton").style.display = "none";
                document.getElementById("submitbutton").style.display = "inline-block";
            }
            else {
                document.getElementById("nextbutton").style.display = "inline-block";
                document.getElementById("submitbutton").style.display = "none";
            }
        }

        function nextQuestion() {

            let options = document.getElementsByName("option");
            let selected = null;

            // to find selected option
            for (let i = 0; i < options.length; i++) {
                if (options[i].checked) {
                    selected = options[i];
                    break;
                }
            }

            saveAnswer();

            if (selected === null) {
                alert("Please select an option");
                return;
            }

            answers[q] = selected.value;   // save answer

            q++;

            if (q <= 3) {
                loadQuestion();
            } else {
                alert("Quiz Finished! Your Score: " + score + "/3");
                window.location.href = "result.html";
            }

            change_button();
        }

        function previousQuestion() {
            saveAnswer();
            q--;
            loadQuestion();

        }

        function submitbutton() {

            let options = document.getElementsByName("option");
            let selected = null;

            // find selected option
            for (let i = 0; i < options.length; i++) {
                if (options[i].checked) {
                    selected = options[i];
                    break;
                }
            }

            if (selected === null) {
                alert("Please select an option");
                return;
            }

            // save last answer
            answers[q] = selected.value;

            score = 0;
            if (answers[1] == 1) score++;
            if (answers[2] == 1) score++;
            if (answers[3] == 1) score++;

            localStorage.setItem("quizscore", score);
            localStorage.setItem("totalquestions", 3);

            window.location.href = "result.html";
        }

        function saveAnswer() {
            let options = document.getElementsByName("option");

            for (let i = 0; i < options.length; i++) {
                if (options[i].checked) {
                    answers[q] = options[i].value;
                    return;
                }
            }
        }
    </script>
</body>
<script>
    window.addEventListener('load', () => {
        setTimeout(() => {
            const preloader = document.getElementById('preloader');
            preloader.style.opacity = '0';
            preloader.style.transition = 'opacity 0.5s ease';
            setTimeout(() => {
                preloader.style.display = 'none';
            }, 500);
        }, 1000); // preloader visible for 1 sec
    });
</script>
</html>
