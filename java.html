<!DOCTYPE html>

<head>
    <title>Simple MCQ Quiz</title>
    <style>
        /* ===== Preloader ===== */
        #preloader {
            position: fixed;
            width: 100%;
            height: 100%;
            background-color: #f7e1d7;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99;
        }

        .loader {
            border: 10px solid #ddd;
            border-top: 10px solid #755a60;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        body {
            background-color: #f7e1d7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial;
        }

        .box {
            background-color: #9d8189;
            padding: 30px;
            border-radius: 10px;
            width: 800px;
            color: white;
            height: 385px;
            padding-bottom: 45px;

        }

        .choices {
            display: grid;
            gap: 15px;
            margin-top: 20px;
        }

        label {
            background: #7d6270;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        label:hover {
            background: #6b555d;
        }

        input {
            margin-right: 10px;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            background: #756068;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .h2 {
            text-align: center;
        }

        #timeleft {
            margin-left: 650px;
        }
    </style>
</head>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<body>
    <!-- Preloader -->
    <div id="preloader">
        <div class="loader"></div>
    </div>

    <div class="box" id="quizBox">
        <h2 class="h2" id="progress_bar"></h2>
        <h3 id="timeleft">Time left:100s</h3>
        <h3 id="question"></h3>

        <div class="choices">
            <label>
                <input type="radio" name="option" value="1">
                <span
                    id="opt_1"></span><!--empty container,It holds only text,It is inline ,JavaScript can easily change it-->
            </label>

            <label>
                <input type="radio" name="option" value="2">
                <span id="opt_2"></span>
            </label>

            <label>
                <input type="radio" name="option" value="3">
                <span id="opt_3"></span>
            </label>

            <label>
                <input type="radio" name="option" value="4">
                <span id="opt_4"></span>
            </label>
        </div>

        <button id="prebutton" onclick="pre_question()">Previous</button>
        <button id="nextbutton" onclick="next_question()">Next</button>
        <button id="finishQuiz" onclick="finishQuiz()" style="display:none;">Submit</button>

    </div>

    <script>
        let current_qno = 1;

        let total_marks = 0;
        let user_ans = {};//Object {} matches question numbers directly.
        let all_Questions = [

    {
        question: "What is Java?",
        choices: ["Programming language", "Database", "OS", "Browser"],
        answer: "1"
    },

    {
        question: "Which keyword is used to create class?",
        choices: ["define", "class", "struct", "object"],
        answer: "2"
    },

    {
        question: "Which method is entry point in Java?",
        choices: ["start()", "main()", "run()", "init()"],
        answer: "2"
    },

    {
        question: "Which keyword is used to inherit class?",
        choices: ["implements", "extends", "inherits", "super"],
        answer: "2"
    },

    {
        question: "Which is used to print output?",
        choices: ["System.out.print()", "echo()", "print()", "display()"],
        answer: "1"
    },

    {
        question: "Java is which type of language?",
        choices: ["Compiled", "Interpreted", "Both", "None"],
        answer: "3"
    },

    {
        question: "Which keyword is used for object?",
        choices: ["new", "create", "object", "init"],
        answer: "1"
    },

    {
        question: "Which concept allows multiple methods with same name?",
        choices: ["Inheritance", "Encapsulation", "Polymorphism", "Abstraction"],
        answer: "3"
    },

    {
        question: "Which keyword is used for constant?",
        choices: ["var", "const", "final", "static"],
        answer: "3"
    },

    {
        question: "Java runs on which machine?",
        choices: ["JVM", "CPU", "RAM", "Compiler"],
        answer: "1"
    }

];
        let totalquestion = all_Questions.length;
        let questionText = document.getElementById("question");
        let opt_1 = document.getElementById("opt_1");
        let opt_2 = document.getElementById("opt_2");
        let opt_3 = document.getElementById("opt_3");
        let opt_4 = document.getElementById("opt_4");
        let timer_text = document.getElementById("timeleft");

        let timeleft = 100;
        load_question();
        startTimer();

        function startTimer() {
            timer_text.innerText = "Time Left :" + timeleft + "s";

            timeleft--;

            if (timeleft >= 0) {
                setTimeout(startTimer, 1000);
            }
            else {
                alert("Time is up!");
                finishQuiz();
            }

        }


        function load_question() {

            $("#quizBox").fadeOut(400, function () {

                document.getElementById("progress_bar").innerHTML = "question " + current_qno + " of " + totalquestion;

                let currentQ = all_Questions[current_qno - 1];

                questionText.innerText = "Q" + current_qno + ": " + currentQ.question;

                opt_1.innerText = currentQ.choices[0];
                opt_2.innerText = currentQ.choices[1];
                opt_3.innerText = currentQ.choices[2];
                opt_4.innerText = currentQ.choices[3];
                $("#quizBox").fadeIn(400);

            });

            let choices = document.getElementsByName("option");

            for (let i = 0; i < choices.length; i++) {
                choices[i].checked = false;
            }

            if (user_ans[current_qno]) {
                for (let i = 0; i < choices.length; i++) {
                    if (choices[i].value == user_ans[current_qno]) {
                        choices[i].checked = true;
                    }
                }

            }

            updateButtons();
        }

        function updateButtons() {
            document.getElementById("prebutton").disabled = (current_qno === 1);

            if (current_qno === totalquestion) {
                document.getElementById("nextbutton").style.display = "none";
                document.getElementById("finishQuiz").style.display = "inline-block";
            }
            else {
                document.getElementById("nextbutton").style.display = "inline-block";
                document.getElementById("finishQuiz").style.display = "none";
            }
        }

        function next_question() {

            let choices = document.getElementsByName("option");
            let selected = null;

            // to find selected option
            for (let i = 0; i < choices.length; i++) {
                if (choices[i].checked) {
                    selected = choices[i];
                    break;
                }
            }

            storeAnswer();



            if (selected === null) {
                alert("Please select an option");
                return;
            }

            //user_ans[current_qno] = selected.value;   // save answer

            current_qno++;

            if (current_qno <= totalquestion) {
                load_question();
            } else {
                alert("Quiz Finished! Your Score: " + total_marks + "/" + totalquestion);
                finishQuiz();
            }

            updateButtons();
        }

        function pre_question() {
            storeAnswer();
            if (current_qno > 1) {
                current_qno--;
                load_question();
            }

        }

        function finishQuiz() {
            localStorage.clear();
            storeAnswer();

            let attempted = 0;
            total_marks = 0;

            // correct answers
            let correctAnswers = {};

            all_Questions.forEach((item, index) => {
                correctAnswers[index + 1] = item.answer;
            });

            for (let i = 1; i <= totalquestion; i++) {

                // store each answer separately
                let qData = all_Questions[i - 1];

                localStorage.setItem("question" + i, qData.question);
                localStorage.setItem("option1_" + i, qData.choices[0]);
                localStorage.setItem("option2_" + i, qData.choices[1]);
                localStorage.setItem("option3_" + i, qData.choices[2] || "N/A");
                localStorage.setItem("option4_" + i, qData.choices[3]);
                //localStorage.setItem("userAnswer" + i, user_ans[i]);
                localStorage.setItem("correctAnswer" + i, correctAnswers[i]);

                if (user_ans[i]) {
                    attempted++;

                    if (user_ans[i] == correctAnswers[i]) {
                        total_marks++;
                    }

                    localStorage.setItem("userAnswer" + i, user_ans[i]);
                } else {
                    localStorage.setItem("userAnswer" + i, "");
                }
            }


            let percentage = Math.round((total_marks / totalquestion) * 100);

            localStorage.setItem("quizscore", total_marks);
            localStorage.setItem("totalquestions", totalquestion);
            localStorage.setItem("attempted", attempted);
            localStorage.setItem("percentage", percentage);

            window.location.href = "result.html";
        }

        function storeAnswer() {
            let choices = document.getElementsByName("option");
            let selected = null;

            for (let i = 0; i < choices.length; i++) {
                if (choices[i].checked) {
                    selected = choices[i].value;
                    break;
                }
            }

            if (selected) {
                user_ans[current_qno] = selected;
            } else {
                user_ans[current_qno] = "";
            }
        }
    </script>
</body>
<script>
    window.addEventListener('load', () => {
        setTimeout(() => {
            const preloader = document.getElementById('preloader');
            preloader.style.opacity = '0';
            preloader.style.transition = 'opacity 0.5s ease';
            setTimeout(() => {
                preloader.style.display = 'none';
            }, 500);
        }, 1000); // preloader visible for 1 sec
    });
</script>

</html>
